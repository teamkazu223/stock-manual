<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>台股個股技術面與防守決策儀表板</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --red: #ef4444;    /* 台股漲 / 偏空警示 */
      --green: #22c55e;  /* 台股跌 / 支撐有守 */
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 24px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 20px; }
    header h1 { font-size: 1.5rem; margin-bottom: 6px; color: var(--accent); }
    header p { color: var(--text-muted); font-size: 0.9rem; }
    
    .search-box { display: flex; gap: 10px; background: var(--card-bg); padding: 14px; border-radius: 12px; border: 1px solid var(--border); }
    input { flex: 1; background: #0f172a; border: 1px solid var(--border); color: #fff; padding: 10px 14px; border-radius: 8px; font-size: 1rem; }
    input:focus { outline: none; border-color: var(--accent); }
    button { background: var(--accent); color: #0f172a; font-weight: 600; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; transition: 0.2s; }
    button:hover { opacity: 0.9; }

    .grid-metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; }
    .metric-card { background: var(--card-bg); padding: 16px; border-radius: 10px; border: 1px solid var(--border); }
    .metric-card .title { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 4px; }
    .metric-card .value { font-size: 1.4rem; font-weight: bold; }
    .metric-card .sub { font-size: 0.75rem; margin-top: 4px; }

    .decision-card { background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border); padding: 20px; }
    .decision-card h2 { font-size: 1.1rem; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
    .tag { font-size: 0.75rem; padding: 2px 8px; border-radius: 4px; font-weight: bold; }
    .tag-bear { background: rgba(239, 68, 68, 0.2); color: var(--red); }
    .tag-bull { background: rgba(34, 197, 94, 0.2); color: var(--green); }

    .strategy-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
    .strategy-list li { padding: 12px; background: rgba(15, 23, 42, 0.6); border-left: 4px solid var(--accent); border-radius: 4px; font-size: 0.9rem; line-height: 1.5; }
    .strategy-list li strong { color: var(--accent); }
    .status-text { color: var(--text-muted); font-size: 0.85rem; text-align: center; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>個股支撐位階與進場策略監控儀表板</h1>
    <p>輸入台股代號，快速試算均線位階（5MA / 20MA / 60MA）與具體分批操作建議</p>
  </header>

  <div class="search-box">
    <input type="text" id="stockId" placeholder="輸入股票代號（例如：2330、2454、0050）" value="2330">
    <button onclick="analyzeStock()">開始分析</button>
  </div>

  <div id="resultArea" style="display: none; display: flex; flex-direction: column; gap: 20px;">
    <!-- 核心數據 -->
    <div class="grid-metrics">
      <div class="metric-card">
        <div class="title">當前收盤 / 現價</div>
        <div class="value" id="curPrice">--</div>
        <div class="sub" id="priceStatus">--</div>
      </div>
      <div class="metric-card">
        <div class="title">5 日均線 (週線)</div>
        <div class="value" id="ma5">--</div>
        <div class="sub" id="ma5Diff">--</div>
      </div>
      <div class="metric-card">
        <div class="title">20 日均線 (月線)</div>
        <div class="value" id="ma20">--</div>
        <div class="sub" id="ma20Diff">--</div>
      </div>
      <div class="metric-card">
        <div class="title">60 日均線 (季線支撐)</div>
        <div class="value" id="ma60">--</div>
        <div class="sub" id="ma60Diff">--</div>
      </div>
    </div>

    <!-- 策略建議卡片 -->
    <div class="decision-card">
      <h2>技術面診斷與操作建議 <span id="statusTag" class="tag">--</span></h2>
      <ul class="strategy-list" id="strategyAdvice">
        <!-- 動態渲染操作條目 -->
      </ul>
    </div>
  </div>

  <div id="loading" class="status-text">請輸入代號並點擊「開始分析」</div>
</div>

<script>
  // 模擬數據字典（若串接公開 API，可直接替換為 fetch 請求）
  const mockDatabase = {
    "2330": { name: "台積電", price: 2420, ma5: 2531, ma20: 2486, ma60: 2414, high: 2590 },
    "2454": { name: "聯發科", price: 1310, ma5: 1330, ma20: 1350, ma60: 1290, high: 1400 },
    "0050": { name: "元大台灣50", price: 198.5, ma5: 202.0, ma20: 200.5, ma60: 196.0, high: 206.5 }
  };

  async function analyzeStock() {
    const code = document.getElementById('stockId').value.trim();
    const loading = document.getElementById('loading');
    const resultArea = document.getElementById('resultArea');

    if (!code) {
      alert("請輸入股票代號");
      return;
    }

    loading.innerText = "資料計算中...";
    
    // 優先讀取模擬/即時數據
    let data = mockDatabase[code];
    
    // 若非預設個股，則依比例動態生成合理計算模型
    if (!data) {
      const base = 100 + (parseInt(code) % 500);
      data = {
        name: `個股 (${code})`,
        price: base,
        ma5: +(base * 1.02).toFixed(1),
        ma20: +(base * 1.01).toFixed(1),
        ma60: +(base * 0.98).toFixed(1),
        high: +(base * 1.08).toFixed(1)
      };
    }

    renderDashboard(data);
    loading.innerText = `最後更新時間：${new Date().toLocaleTimeString('zh-TW')}`;
    resultArea.style.display = "flex";
  }

  function renderDashboard(d) {
    document.getElementById('curPrice').innerText = `${d.price} 元`;
    document.getElementById('ma5').innerText = `${d.ma5} 元`;
    document.getElementById('ma20').innerText = `${d.ma20} 元`;
    document.getElementById('ma60').innerText = `${d.ma60} 元`;

    const distMa60 = (((d.price - d.ma60) / d.ma60) * 100).toFixed(2);
    const distMa5 = (((d.price - d.ma5) / d.ma5) * 100).toFixed(2);

    document.getElementById('priceStatus').innerText = `${d.name}`;
    document.getElementById('ma5Diff').innerText = `短線乖離：${distMa5}%`;
    document.getElementById('ma20Diff').innerText = `月線差距：${(d.price - d.ma20).toFixed(1)} 元`;
    document.getElementById('ma60Diff').innerText = `距季線：${(d.price - d.ma60).toFixed(1)} 元 (${distMa60}%)`;

    // 決策邏輯推算
    const tag = document.getElementById('statusTag');
    const adviceList = document.getElementById('strategyAdvice');
    adviceList.innerHTML = '';

    const isNearMa60 = Math.abs(distMa60) <= 1.5;
    const isBelowMa5 = d.price < d.ma5;

    if (d.price < d.ma60) {
      tag.className = 'tag tag-bear';
      tag.innerText = '跌破季線 (保守觀望)';
    } else if (isNearMa60) {
      tag.className = 'tag tag-bear';
      tag.innerText = '季線保衛戰 (左側試探)';
    } else {
      tag.className = 'tag tag-bull';
      tag.innerText = '多方支撐之上';
    }

    // 具體策略建議生成
    const advice = [];
    if (isNearMa60) {
      advice.push(`<strong>左側試探掛單：</strong> 目前股價接近季線（約 ${d.ma60} 元），距離僅約 ${Math.abs(d.price - d.ma60).toFixed(1)} 元。偏好逢低布局者可在此區間投入第一批資金（約 20%~30%），嚴禁一次打滿。`);
      advice.push(`<strong>防守停損設定：</strong> 以連續 2 日收盤跌破季線以下 1.5%～2%（約 ${(d.ma60 * 0.98).toFixed(1)} 元）為嚴格防守標準，若失守需控制風險或暫緩加碼。`);
    } else if (d.price < d.ma60) {
      advice.push(`<strong>深層支撐等待：</strong> 價格已落在季線之下，技術面下行慣性未止，建議等待下檔前波整理平台再做評估，不宜躁進摸底。`);
    } else {
      advice.push(`<strong>多頭拉回偏多：</strong> 現價穩居季線上方，回測未破均線前中長線多方架構未遭破壞。`);
    }

    if (isBelowMa5) {
      advice.push(`<strong>右側進場條件：</strong> 短期均線（5MA 約 ${d.ma5} 元）仍壓在上方，短期慣性為弱勢整理。穩健型操作建議等待「出量紅 K 實體站回 5MA」後再行順勢加碼，勝率較高。`);
    }

    advice.forEach(item => {
      const li = document.createElement('li');
      li.innerHTML = item;
      adviceList.appendChild(li);
    });
  }

  // 初始載入台積電數據
  analyzeStock();
</script>

</body>
</html>
