<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>個股進階技術與籌碼決策儀表板</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --red: #ef4444;    
      --green: #22c55e;  
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 24px; display: flex; justify-content: center; line-height: 1.5; }
    .container { width: 100%; max-width: 900px; display: flex; flex-direction: column; gap: 20px; }
    header h1 { font-size: 1.5rem; margin-bottom: 6px; color: var(--accent); }
    header p { color: var(--text-muted); font-size: 0.9rem; }
    
    .input-section { background: var(--card-bg); padding: 20px; border-radius: 12px; border: 1px solid var(--border); }
    .input-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 16px; margin-bottom: 16px; }
    .input-group { display: flex; flex-direction: column; gap: 6px; }
    .input-group label { font-size: 0.85rem; color: var(--text-muted); }
    input, select { background: #0f172a; border: 1px solid var(--border); color: #fff; padding: 10px; border-radius: 8px; font-size: 1rem; }
    input:focus, select:focus { outline: none; border-color: var(--accent); }
    button { width: 100%; background: var(--accent); color: #0f172a; font-weight: 600; font-size: 1rem; border: none; padding: 12px; border-radius: 8px; cursor: pointer; transition: 0.2s; }
    button:hover { opacity: 0.9; }

    .grid-metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; }
    .metric-card { background: var(--card-bg); padding: 16px; border-radius: 10px; border: 1px solid var(--border); }
    .metric-card .title { font-size: 0.8rem; color: var(--text-muted); margin-bottom: 4px; }
    .metric-card .value { font-size: 1.4rem; font-weight: bold; color: #fff; }
    .metric-card .sub { font-size: 0.75rem; margin-top: 4px; }

    .decision-card { background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border); padding: 20px; }
    .decision-card h2 { font-size: 1.1rem; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
    .tag { font-size: 0.75rem; padding: 4px 8px; border-radius: 4px; font-weight: bold; }
    .tag-bear { background: rgba(239, 68, 68, 0.2); color: var(--red); }
    .tag-bull { background: rgba(34, 197, 94, 0.2); color: var(--green); }
    .tag-neutral { background: rgba(148, 163, 184, 0.2); color: var(--text-muted); }

    .strategy-list { list-style: none; display: flex; flex-direction: column; gap: 10px; }
    .strategy-list li { padding: 14px; background: rgba(15, 23, 42, 0.6); border-left: 4px solid var(--accent); border-radius: 4px; font-size: 0.95rem; }
    .strategy-list li strong { color: var(--accent); display: block; margin-bottom: 4px; font-size: 1rem; }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>個股進階技術與籌碼決策儀表板</h1>
    <p>結合均線位階、成交量與籌碼動能，提供更全面的進出場策略。</p>
  </header>

  <div class="input-section">
    <div class="input-grid">
      <div class="input-group">
        <label>股票名稱或代號</label>
        <input type="text" id="stockName" value="台積電">
      </div>
      <div class="input-group">
        <label>最新收盤價</label>
        <input type="number" id="price" step="0.01" value="2420">
      </div>
      <div class="input-group">
        <label>5日均線 (5MA)</label>
        <input type="number" id="ma5" step="0.01" value="2531">
      </div>
      <div class="input-group">
        <label>20日均線 (月線)</label>
        <input type="number" id="ma20" step="0.01" value="2486">
      </div>
      <div class="input-group">
        <label>60日均線 (季線)</label>
        <input type="number" id="ma60" step="0.01" value="2414">
      </div>
      <!-- 新增：量能與動能選項 -->
      <div class="input-group">
        <label>今日成交量狀態</label>
        <select id="volumeStatus">
          <option value="normal">一般量 (無明顯變化)</option>
          <option value="shrink">明顯量縮 (低於5日均量)</option>
          <option value="surge">出量/爆量 (高於近日水準)</option>
        </select>
      </div>
      <div class="input-group">
        <label>籌碼/MACD輔助</label>
        <select id="momentumStatus">
          <option value="weak">偏弱 (MACD死叉/外資賣超)</option>
          <option value="neutral">中性 (指標盤整中)</option>
          <option value="strong">偏強 (MACD金叉/外資買超)</option>
        </select>
      </div>
    </div>
    <button onclick="analyzeStock()">計算並產生進階建議</button>
  </div>

  <div id="resultArea" style="display: none; flex-direction: column; gap: 20px;">
    <div class="grid-metrics">
      <div class="metric-card">
        <div class="title">您分析的標的</div>
        <div class="value" id="resName">--</div>
        <div class="sub" id="resPrice">現價：--</div>
      </div>
      <div class="metric-card">
        <div class="title">5MA 短線乖離</div>
        <div class="value" id="ma5DiffValue">--</div>
        <div class="sub" id="ma5DiffPct">--</div>
      </div>
      <div class="metric-card">
        <div class="title">月線距離</div>
        <div class="value" id="ma20DiffValue">--</div>
        <div class="sub" id="ma20DiffPct">--</div>
      </div>
      <div class="metric-card">
        <div class="title">季線距離</div>
        <div class="value" id="ma60DiffValue">--</div>
        <div class="sub" id="ma60DiffPct">--</div>
      </div>
    </div>

    <div class="decision-card">
      <h2>綜合盤勢診斷 <span id="statusTag" class="tag">--</span></h2>
      <ul class="strategy-list" id="strategyAdvice"></ul>
    </div>
  </div>
</div>

<script>
  function analyzeStock() {
    const name = document.getElementById('stockName').value.trim() || '未命名標的';
    const price = parseFloat(document.getElementById('price').value);
    const ma5 = parseFloat(document.getElementById('ma5').value);
    const ma20 = parseFloat(document.getElementById('ma20').value);
    const ma60 = parseFloat(document.getElementById('ma60').value);
    
    // 取得下拉選單的值
    const vol = document.getElementById('volumeStatus').value;
    const mom = document.getElementById('momentumStatus').value;

    if (isNaN(price) || isNaN(ma5) || isNaN(ma20) || isNaN(ma60)) {
      alert("請確保均線與價格皆輸入數字！");
      return;
    }

    const diff5 = price - ma5;
    const diff20 = price - ma20;
    const diff60 = price - ma60;
    
    const pct5 = ((diff5 / ma5) * 100).toFixed(2);
    const pct20 = ((diff20 / ma20) * 100).toFixed(2);
    const pct60 = ((diff60 / ma60) * 100).toFixed(2);

    document.getElementById('resName').innerText = name;
    document.getElementById('resPrice').innerText = `現價：${price}`;
    
    document.getElementById('ma5DiffValue').innerText = diff5 > 0 ? `+${diff5.toFixed(2)}` : diff5.toFixed(2);
    document.getElementById('ma5DiffValue').style.color = diff5 > 0 ? "var(--red)" : "var(--green)";
    document.getElementById('ma5DiffPct').innerText = `乖離率：${pct5}%`;

    document.getElementById('ma20DiffValue').innerText = diff20 > 0 ? `+${diff20.toFixed(2)}` : diff20.toFixed(2);
    document.getElementById('ma20DiffValue').style.color = diff20 > 0 ? "var(--red)" : "var(--green)";
    document.getElementById('ma20DiffPct').innerText = `乖離率：${pct20}%`;

    document.getElementById('ma60DiffValue').innerText = diff60 > 0 ? `+${diff60.toFixed(2)}` : diff60.toFixed(2);
    document.getElementById('ma60DiffValue').style.color = diff60 > 0 ? "var(--red)" : "var(--green)";
    document.getElementById('ma60DiffPct').innerText = `距季線：${pct60}%`;

    const tag = document.getElementById('statusTag');
    const adviceList = document.getElementById('strategyAdvice');
    adviceList.innerHTML = '';

    const isNearMa60 = Math.abs(pct60) <= 2.0;
    const isBelowMa60 = price < ma60;
    const isBelowMa5 = price < ma5;

    // 狀態標籤判斷
    if (isBelowMa60 && !isNearMa60) {
      tag.className = 'tag tag-bear'; tag.innerText = '長線破線轉弱';
    } else if (isNearMa60) {
      tag.className = 'tag tag-bear'; tag.innerText = '季線支撐測試中';
    } else if (isBelowMa5) {
      tag.className = 'tag tag-neutral'; tag.innerText = '短線修正中';
    } else {
      tag.className = 'tag tag-bull'; tag.innerText = '多方控盤中';
    }

    const advice = [];

    // 1. 結合「位階」與「量能」的判斷
    if (isNearMa60) {
      if (vol === 'shrink') {
        advice.push(`<strong>🛡️ 季線量縮測試 (左側買點浮現)：</strong> 目前股價逼近季線（${ma60}）且「明顯量縮」，顯示下殺取量力道減弱，籌碼趨於安定。這是左側交易者可以考慮建立 20%~30% 試探性部位的好時機。`);
      } else if (vol === 'surge') {
        advice.push(`<strong>⚠️ 季線出量下殺 (警訊)：</strong> 股價逼近季線（${ma60}）卻伴隨「爆量」，代表停損賣壓或主力倒貨湧現。強烈建議「不要馬上接刀」，觀察明後兩天是否會貫破季線。`);
      } else {
        advice.push(`<strong>🛡️ 季線保衛戰：</strong> 股價靠近季線（${ma60}）。可在此處試單第一筆資金，並嚴格設定收盤跌破季線 2% (約 ${(ma60*0.98).toFixed(1)}) 作為停損。`);
      }
    } else if (isBelowMa60) {
      advice.push(`<strong>📉 跌破季線：</strong> 技術面中長線轉弱。除非你是左側尋找超跌反彈的定存股買家，否則波段操作建議暫時觀望。`);
    } else {
      advice.push(`<strong>📈 長線趨勢：</strong> 股價處於季線之上，長線保護短線，多方架構完整。`);
    }

    // 2. 結合「短線突破」與「動能」的判斷
    if (isBelowMa5) {
      if (mom === 'weak') {
        advice.push(`<strong>⏳ 均線與動能雙弱：</strong> 股價低於 5MA（${ma5}），且籌碼/MACD動能偏弱。短期下行慣性強，右側交易者請務必耐心等待「帶量收紅站上 5MA」再動作。`);
      } else {
        advice.push(`<strong>⏳ 短線乖離修正：</strong> 股價受制於 5MA（${ma5}），等待站回 5MA 即是短線止跌訊號。`);
      }
    } else if (!isBelowMa60) {
      if (vol === 'surge' && mom === 'strong') {
        advice.push(`<strong>🔥 價量齊揚突破：</strong> 站上 5MA 且出量、動能偏強，短線發動上攻機率高，可順勢偏多操作，防守點可設在今日 K 線低點或 5MA。`);
      } else {
        advice.push(`<strong>✅ 短線強勢：</strong> 站穩 5MA 之上，維持短多格局，持股可續抱。`);
      }
    }

    advice.forEach(item => {
      const li = document.createElement('li');
      li.innerHTML = item;
      adviceList.appendChild(li);
    });

    document.getElementById('resultArea').style.display = "flex";
  }
</script>

</body>
</html>
